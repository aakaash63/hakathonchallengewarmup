spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
server.port=${PORT:8080}

# H2 local dev
spring.datasource.url=jdbc:h2:mem:hopeguide;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:HopeGuideAIJwtSecretKeyMustBeAtLeast32CharactersLong2026}
jwt.expiration=86400000

gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

frontend.url=${FRONTEND_URL:http://localhost:5173}
logging.level.com.hopeguide=INFO
logging.level.org.springframework.security=WARN
